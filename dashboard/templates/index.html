<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Security Simulation - Blue Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Blue Shade Theme */
        :root {
            --bg-color: #000000;
            --panel-bg: #000033;
            --border-color: #00bfff;
            --text-primary: #00bfff;
            --text-secondary: #87cefa;
            --accent-color: #ff4500;
            --warning-color: #ffd700;
            --danger-color: #ff0000;
            --success-color: #00ff00;
            --font-mono: 'Courier New', monospace;
            --font-sys: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sys);
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Matrix background effect with blue tint */
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            min-height: calc(100vh - 40px);
            display: flex;
            flex-direction: column;
        }

        h1 {
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-shadow: 0 0 10px var(--text-primary);
            letter-spacing: 2px;
            font-family: var(--font-mono);
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--border-color), transparent);
            animation: scanline 2s linear infinite;
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        .panel h2 {
            color: var(--text-primary);
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            font-family: var(--font-mono);
        }

        .controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label {
            font-weight: bold;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            text-shadow: 0 0 5px var(--text-secondary);
        }

        select, input {
            padding: 8px 12px;
            background: #000800;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        select:focus, input:focus {
            outline: none;
            box-shadow: 0 0 8px var(--text-primary);
        }

        button {
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.7);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(0, 255, 0, 0.2),
                transparent
            );
            transition: 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            background: rgba(0, 10, 0, 0.8);
            box-shadow: 0 0 15px var(--text-primary);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.danger {
            border-color: var(--danger-color);
            color: var(--danger-color);
        }

        button.danger:hover {
            box-shadow: 0 0 15px var(--danger-color);
            background: rgba(10, 0, 0, 0.8);
        }

        button.success {
            border-color: var(--success-color);
            color: var(--success-color);
        }

        button.success:hover {
            box-shadow: 0 0 15px var(--success-color);
            background: rgba(0, 10, 0, 0.8);
        }

        .status {
            display: flex;
            gap: 20px;
            margin: 15px 0;
        }

        .status-item {
            background: rgba(0, 10, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 15px;
            text-align: center;
            flex: 1;
            position: relative;
        }

        .status-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: var(--font-mono);
        }

        .status-value {
            font-size: 2rem;
            font-weight: bold;
            margin: 8px 0;
            font-family: var(--font-mono);
            text-shadow: 0 0 5px var(--text-primary);
        }

        .status-value.ddos-active { color: var(--danger-color); text-shadow: 0 0 8px var(--danger-color); }
        .status-value.sql-active { color: var(--danger-color); text-shadow: 0 0 8px var(--danger-color); }
        .status-value.ddos-stopped { color: var(--success-color); text-shadow: 0 0 4px var(--success-color); }
        .status-value.sql-stopped { color: var(--success-color); text-shadow: 0 0 4px var(--success-color); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .stat-card {
            background: rgba(0, 10, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 15px;
            text-align: center;
            position: relative;
        }

        .stat-card h3 {
            margin: 0 0 10px 0;
            font-size: 1rem;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--text-primary);
            margin: 8px 0;
            font-family: var(--font-mono);
            text-shadow: 0 0 5px var(--text-primary);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }

        .logs {
            background: rgba(0, 10, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 13px;
            position: relative;
        }

        .logs::-webkit-scrollbar {
            width: 8px;
        }

        .logs::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.5);
        }

        .logs::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .log-entry {
            margin: 6px 0;
            padding: 8px;
            border-left: 3px solid var(--border-color);
            background: rgba(0, 0, 0, 0.2);
        }

        .log-entry.attack {
            border-left-color: var(--danger-color);
            background: rgba(20, 0, 0, 0.3);
        }

        .log-entry.defense {
            border-left-color: var(--success-color);
            background: rgba(0, 20, 0, 0.3);
        }

        .log-entry.info {
            border-left-color: var(--text-secondary);
            background: rgba(0, 0, 20, 0.2);
        }

        .log-entry.warning {
            border-left-color: var(--warning-color);
            background: rgba(20, 20, 0, 0.3);
        }

        .log-entry .timestamp {
            color: var(--text-secondary);
            font-weight: bold;
            margin-right: 8px;
        }

        .log-entry .message {
            flex: 1;
        }

        /* Charts container */
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .chart-card {
            background: rgba(0, 10, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 15px;
        }

        .chart-card h3 {
            margin: 0 0 12px 0;
            font-size: 1.1rem;
            color: var(--text-primary);
            font-family: var(--font-mono);
            text-align: center;
        }

        canvas {
            width: 100% !important;
            height: 200px !important;
            display: block;
        }

        /* Network visualization */
        .network-viz {
            background: rgba(0, 10, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 15px;
            height: 250px;
            position: relative;
            overflow: hidden;
        }

        .network-viz canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        /* World map */
        #worldMapCanvas {
            width: 100%;
            height: 200px;
            background: #00001a;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin: 10px 0;
            position: relative;
        }

        /* Pulse animation for active attacks */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 69, 0, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 69, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 69, 0, 0); }
        }

        .pulse-active {
            animation: pulse 2s infinite;
        }

        /* Terminal-style input */
        .terminal-input {
            background: #000;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: var(--font-mono);
            padding: 12px;
            width: 100%;
            margin: 10px 0;
            border-radius: 3px;
            font-size: 1rem;
        }

        .terminal-input:focus {
            outline: none;
            box-shadow: 0 0 10px var(--text-primary);
        }

        /* Hacker-style text effects */
        .hacker-text {
            font-family: var(--font-mono);
            letter-spacing: 1px;
            text-shadow: 0 0 5px var(--text-primary);
        }

        .glitch {
            position: relative;
        }

        .glitch::before {
            content: attr(data-text);
            position: absolute;
            left: -2px;
            text-shadow: -2px 0 var(--danger-color);
            top: 0;
            width: 100%;
            overflow: hidden;
            clip: rect(0, 9999px, 0, 0);
            animation: glitch-anim 2s infinite linear alternate-reverse;
        }

        .glitch::after {
            content: attr(data-text);
            position: absolute;
            left: 2px;
            text-shadow: 2px 0 var(--success-color);
            top: 0;
            width: 100%;
            overflow: hidden;
            clip: rect(0, 9999px, 0, 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;

<body>
    <!-- Matrix background -->
    <canvas id="matrix-bg"></canvas>

    <div class="container">
        <h1 class="hacker-text glitch" data-text="BANKING SECURITY SIMULATION">BANKING SECURITY SIMULATION</h1>

        <div class="panel">
            <h2>ATTACK CONTROLS</h2>
            <div class="controls">
                <div class="control-group">
                    <label for="ddos-type">ATTACK TYPE:</label>
                    <select id="ddos-type">
                        <option value="http">HTTP FLOOD</option>
                        <option value="udp">UDP FLOOD</option>
                        <option value="syn">SYN FLOOD</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="ddos-duration">DURATION (S):</label>
                    <input type="number" id="ddos-duration" value="10" min="1" max="60">
                </div>
                <div class="control-group">
                    <label for="ddos-threads">THREADS:</label>
                    <input type="number" id="ddos-threads" value="5" min="1" max="20">
                </div>
                <button onclick="startDDoS()" class="danger">LAUNCH DDoS ATTACK</button>
                <button onclick="startSQL()" class="danger">LAUNCH SQL INJECTION</button>
                <button onclick="testDefenses()" class="success">TEST DEFENSES</button>
                <button class="danger" onclick="clearLogs()">CLEAR LOGS</button>
            </div>

            <div class="status">
                <div class="status-item">
                    <div class="status-label">DDoS STATUS</div>
                    <div class="status-value" id="ddos-status">STOPPED</div>
                </div>
                <div class="status-item">
                    <div class="status-label">SQL STATUS</div>
                    <div class="status-value" id="sql-status">STOPPED</div>
                </div>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-card">
                <h3>ATTACK THROUGHPUT</h3>
                <canvas id="throughputChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>DEFENSE EFFECTIVENESS</h3>
                <canvas id="defenseChart"></canvas>
            </div>
        </div>

        <div class="panel">
            <h2>NETWORK TRAFFIC VISUALIZATION</h2>
            <div class="network-viz">
                <canvas id="networkChart"></canvas>
            </div>
        </div>

        <div class="panel">
            <h2>GLOBAL ATTACK ORIGINS</h2>
            <canvas id="worldMapCanvas"></canvas>
        </div>

        <div class="panel">
            <h2>SIMULATION LOGS</h2>
            <div class="logs" id="logs"></div>
        </div>
    </div>

    <script>
        // Global variables
        let statusInterval = null;
        let matrixInterval = null;
        let charts = {};
        let networkChartInstance = null;
        let worldMapContext = null;
        let worldMapWidth = 0;
        let worldMapHeight = 0;

        // World cities for attack origin simulation (latitude, longitude)
        const worldCities = [
            { name: "New York", lat: 40.7128, lng: -74.0060 },
            { name: "London", lat: 51.5074, lng: -0.1278 },
            { name: "Tokyo", lat: 35.6762, lng: 139.6503 },
            { name: "Sydney", lat: -33.8688, lng: 151.2093 },
            { name: "São Paulo", lat: -23.5505, lng: -46.6333 },
            { name: "Cape Town", lat: -33.9249, lng: 18.4241 },
            { name: "Moscow", lat: 55.7558, lng: 37.6176 },
            { name: "Beijing", lat: 39.9042, lng: 116.4074 },
            { name: "Dubai", lat: 25.2048, lng: 55.2708 },
            { name: "Mumbai", lat: 19.0760, lng: 72.8777 },
            { name: "Los Angeles", lat: 34.0522, lng: -118.2437 },
            { name: "Paris", lat: 48.8566, lng: 2.3522 },
            { name: "Singapore", lat: 1.3521, lng: 103.8198 },
            { name: "Johannesburg", lat: -26.2041, lng: 28.0473 },
            { name: "Mexico City", lat: 19.4326, lng: -99.1332 }
        ];

        // Utility functions
        function $(selector) {
            return document.querySelector(selector);
        }

        function $$(selector) {
            return document.querySelectorAll(selector);
        }

        function addLogToUI(message, level = 'INFO') {
            const logsContainer = $('#logs');
            if (!logsContainer) return;

            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${level.toLowerCase()}`;

            const timestampSpan = document.createElement('span');
            timestampSpan.className = 'timestamp';
            timestampSpan.textContent = `[${new Date().toLocaleTimeString()}]`;

            const messageSpan = document.createElement('span');
            messageSpan.className = 'message';
            messageSpan.textContent = message;

            logEntry.appendChild(timestampSpan);
            logEntry.appendChild(messageSpan);
            logsContainer.appendChild(logEntry);

            // Scroll to bottom
            logsContainer.scrollTop = logsContainer.scrollHeight;
        }

        // Matrix background effect (blue tint)
        function initMatrixBg() {
            const canvas = $('#matrix-bg');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            resize();
            window.addEventListener('resize', resize);

            const characters = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()';
            const fontSize = 14;
            const columns = Math.floor(canvas.width / fontSize);
            const drops = [];

            for (let i = 0; i < columns; i++) {
                drops[i] = 1;
            }

            function draw() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#00bfff'; // Blue for matrix
                ctx.font = fontSize + 'px monospace';

                for (let i = 0; i < drops.length; i++) {
                    const text = characters[Math.floor(Math.random() * characters.length)];
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }

            matrixInterval = setInterval(draw, 50);
        }

        // Initialize world map
        function initWorldMap() {
            const canvas = $('#worldMapCanvas');
            if (!canvas) return;

            worldMapContext = canvas.getContext('2d');
            resizeWorldMap();
            window.addEventListener('resize', resizeWorldMap);
            drawWorldMapBackground();
        }

        function resizeWorldMap() {
            const canvas = $('#worldMapCanvas');
            if (!canvas) return;

            worldMapWidth = canvas.width;
            worldMapHeight = canvas.height;
        }

        function drawWorldMapBackground() {
            if (!worldMapContext) return;

            // Fill background
            worldMapContext.fillStyle = '#00001a';
            worldMapContext.fillRect(0, 0, worldMapWidth, worldMapHeight);

            // Draw grid lines (latitude and longitude)
            worldMapContext.strokeStyle = 'rgba(0, 191, 255, 0.1)';
            worldMapContext.lineWidth = 0.5;

            // Draw longitude lines (every 30 degrees)
            for (let lng = -180; lng <= 180; lng += 30) {
                const x = ((lng + 180) / 360) * worldMapWidth;
                worldMapContext.beginPath();
                worldMapContext.moveTo(x, 0);
                worldMapContext.lineTo(x, worldMapHeight);
                worldMapContext.stroke();
            }

            // Draw latitude lines (every 30 degrees)
            for (let lat = -90; lat <= 90; lat += 30) {
                const y = ((90 - lat) / 180) * worldMapHeight;
                worldMapContext.beginPath();
                worldMapContext.moveTo(0, y);
                worldMapContext.lineTo(worldMapWidth, y);
                worldMapContext.stroke();
            }

            // Draw border
            worldMapContext.strokeStyle = '#00bfff';
            worldMapContext.lineWidth = 1;
            worldMapContext.strokeRect(0, 0, worldMapWidth, worldMapHeight);
        }

        // Convert lat/lng to canvas coordinates
        function latLngToPixel(lat, lng) {
            const x = ((lng + 180) / 360) * worldMapWidth;
            const y = ((90 - lat) / 180) * worldMapHeight;
            return { x, y };
        }

        // Attack functions
        function startDDoS() {
            const type = $('#ddos-type') ? $('#ddos-type').value : 'http';
            const duration = parseInt($('#ddos-duration') ? $('#ddos-duration').value : '10');
            const threads = parseInt($('#ddos-threads') ? $('#ddos-threads').value : '5');

            fetch('/start_ddos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({type, duration, threads})
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log(data);
                updateStatus();
                activateAttackVisuals();
                addLogToUI(`DDoS ${type.toUpperCase()} attack started`, 'ATTACK');
            })
            .catch(err => {
                console.error('Error starting DDoS attack:', err);
                addLogToUI(`Error starting DDoS: ${err.message}`, 'ERROR');
            });
        }

            const type = $('#ddos-type') ? $('#ddos-type').value : 'basic';

        function clearLogs() {
            fetch('/clear_logs', {
                method: 'POST'
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);

                $('#logs').innerHTML = '';

        function activateAttackVisuals() {
            // Add pulsating effect to buttons
            const ddosBtn = $('button[onclick*="startDDoS"]');
            const sqlBtn = $('button[onclick*="startSQL"]');

            if (ddosBtn) ddosBtn.classList.add('pulse-active');
            if (sqlBtn) sqlBtn.classList.add('pulse-active');

            setTimeout(() => {
                if (ddosBtn) ddosBtn.classList.remove('pulse-active');
                if (sqlBtn) sqlBtn.classList.remove('pulse-active');
            }, 3000);
        }

        // Update functions
        function updateStatus() {
            fetch('/get_status')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                // Update attack status
                const ddosStatus = $('#ddos-status');
                const sqlStatus = $('#sql-status');

                if (ddosStatus) {
                    ddosStatus.textContent = data.ddos_active ? 'ACTIVE' : 'STOPPED';
                    ddosStatus.className = `status-value ${data.ddos_active ? 'ddos-active' : 'ddos-stopped'}`;
                }

                if (sqlStatus) {
                    sqlStatus.textContent = data.sql_active ? 'ACTIVE' : 'STOPPED';
                    sqlStatus.className = `status-value ${data.sql_active ? 'sql-active' : 'sql-stopped'}`;
                }

                // Update stats
                const ddosPacketsEl = $('#ddos-packets');
                const sqlAttemptsEl = $('#sql-attempts');
                const blockedAttemptsEl = $('#blocked-attempts');
                const rateLimitedIPsEl = $('#rate-limited-ips');

                if (ddosPacketsEl) {
                    // Show in thousands (K) with one decimal if needed
                    const packets = data.stats.ddos_packets || 0;
                    if (packets >= 1000) {
                        ddosPacketsEl.textContent = (packets / 1000).toFixed(1) + 'K';
                    } else {
                        ddosPacketsEl.textContent = packets;
                    }
                }
                if (sqlAttemptsEl) sqlAttemptsEl.textContent = data.stats.sql_attempts || 0;
                if (blockedAttemptsEl) blockedAttemptsEl.textContent = data.stats.blocked_attempts || 0;
                if (rateLimitedIPsEl) rateLimitedIPsEl.textContent = data.stats.rate_limited_ips || 0;

                // Update charts and visualizations
                updateCharts(data);
                updateNetworkViz(data);
                updateWorldMap(data);

                // Update logs
                updateLogs();
            })
            .catch(err => {
                console.error('Error fetching status:', err);
                addLogToUI(`Status error: ${err.message}`, 'ERROR');
            });
        }

        function updateCharts(data) {
            // Check if Chart.js is loaded
            if (typeof Chart === 'undefined') return;

            // Update throughput chart (simulated)
            if (charts.throughput) {
                try {
                    const newData = [...charts.throughput.data.datasets[0].data.slice(1),
                                    data.ddos_active ? Math.random() * 100 : 0];
                    charts.throughput.data.datasets[0].data = newData;
                    charts.throughput.update('silent');
                } catch (e) {
                    console.error('Error updating throughput chart:', e);
                }
            }

            // Update defense chart
            if (charts.defense) {
                try {
                    const blocked = data.stats.blocked_attempts || 0;
                    const total = Math.max((data.stats.sql_attempts || 1), 1);
                    const allowed = total - blocked;
                    const blockedPercent = (blocked / total) * 100;

                    charts.defense.data.datasets[0].data = [blockedPercent, 100 - blockedPercent];
                    charts.defense.update('silent');
                } catch (e) {
                    console.error('Error updating defense chart:', e);
                }
            }
        }

        function updateNetworkViz(data) {
            if (!networkChartInstance) return;

            try {
                // Clear old data and add new points based on attack status
                networkChartInstance.data.datasets[0].data = [];

                if (data.ddos_active) {
                    // Generate random network traffic points during attack
                    for (let i = 0; i < 20; i++) {
                        networkChartInstance.data.datasets[0].data.push({
                            x: Math.random() * 100,
                            y: Math.random() * 100
                        });
                    }
                } else {
                    // Generate minimal background traffic
                    for (let i = 0; i < 5; i++) {
                        networkChartInstance.data.datasets[0].data.push({
                            x: Math.random() * 30,
                            y: Math.random() * 30
                        });
                    }
                }

                networkChartInstance.update('silent');
            } catch (e) {
                console.error('Error updating network visualization:', e);
            }
        }

        function updateWorldMap(data) {
            if (!worldMapContext) return;

            // Clear the map and redraw background
            drawWorldMapBackground();

            // If no attack active, just show the map with maybe a few idle points
            if (!data.ddos_active && !data.sql_active) {
                // Draw a few idle points (normal traffic)
                drawIdlePoints();
                return;
            }

            // Calculate number of attack points to show (based on packet count, but capped)
            let attackCount = 0;
            if (data.ddos_active) {
                // Scale down the packet count for visualization (max 50 points)
                attackCount = Math.min(Math.floor((data.stats.ddos_packets || 0) / 1000), 50);
            } else if (data.sql_active) {
                // For SQL, use attempt count (max 20 points)
                attackCount = Math.min(data.stats.sql_attempts || 0, 20);
            }

            // Ensure at least some points if attack is active
            if (data.ddos_active || data.sql_active) {
                attackCount = Math.max(attackCount, 5);
            }

            // Draw attack points
            for (let i = 0; i < attackCount; i++) {
                // Pick a random city
                const city = worldCities[Math.floor(Math.random() * worldCities.length)];

                // Add some random variation to simulate different IPs in the same area
                const latVariation = (Math.random() - 0.5) * 2; // ±1 degree
                const lngVariation = (Math.random() - 0.5) * 2; // ±1 degree

                const lat = city.lat + latVariation;
                const lng = city.lng + lngVariation;

                const { x, y } = latLngToPixel(lat, lng);

                // Draw point
                worldMapContext.fillStyle = '#ff4500'; // Orange red for attacks
                worldMapContext.beginPath();
                worldMapContext.arc(x, y, 3, 0, Math.PI * 2);
                worldMapContext.fill();

                // Add glow effect
                worldMapContext.shadowColor = '#ff4500';
                worldMapContext.shadowBlur = 8;
                worldMapContext.fill();
                worldMapContext.shadowColor = 'transparent'; // Reset
            }

            // Draw a few idle points for normal traffic
            drawIdlePoints();
        }

        function drawIdlePoints() {
            // Draw a few points representing normal traffic
            for (let i = 0; i < 5; i++) {
                const city = worldCities[Math.floor(Math.random() * worldCities.length)];
                const { x, y } = latLngToPixel(city.lat, city.lng);

                worldMapContext.fillStyle = '#00bfff'; // Blue for normal
                worldMapContext.beginPath();
                worldMapContext.arc(x, y, 2, 0, Math.PI * 2);
                worldMapContext.fill();
            }
        }

        function updateLogs() {
            fetch('/get_status')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                const logsContainer = $('#logs');
                if (!logsContainer) return;

                logsContainer.innerHTML = '';

                const logs = data.logs || [];
                logs.forEach(log => {
                    const logEntry = document.createElement('div');
                    logEntry.className = `log-entry ${log.level.toLowerCase()}`;

                    const timestampSpan = document.createElement('span');
                    timestampSpan.className = 'timestamp';
                    timestampSpan.textContent = `[${log.timestamp}]`;

                    const messageSpan = document.createElement('span');
                    messageSpan.className = 'message';
                    messageSpan.textContent = log.message;

                    logEntry.appendChild(timestampSpan);
                    logEntry.appendChild(messageSpan);
                    logsContainer.appendChild(logEntry);
                });

                // Scroll to bottom
                if (logsContainer) {
                    logsContainer.scrollTop = logsContainer.scrollHeight;
                }
            })
            .catch(err => {
                console.error('Error fetching logs:', err);
                addLogToUI(`Logs error: ${err.message}`, 'ERROR');
            });
        }

        // Start periodic updates
        function startUpdates() {
            statusInterval = setInterval(updateStatus, 1500); // Update every 1.5 seconds
        }

        // Stop updates when page is unloaded
        window.addEventListener('beforeunload', () => {
            if (statusInterval) clearInterval(statusInterval);
            if (matrixInterval) clearInterval(matrixInterval);
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initMatrixBg();
            initCharts();
            initWorldMap();
            startUpdates();
            updateStatus();
        });
    </script>
